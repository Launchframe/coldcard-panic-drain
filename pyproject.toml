[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coldcard-panic-drain"
version = "0.1.0"
description = "Offline Sparrow wallet panic-drain: label transplant + batch PSBT export for Coldcard"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Launchframe" }]
dependencies = [
  "embit>=0.8.0",
  "typer>=0.12.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
coldcard-panic-drain = "coldcard_panic_drain.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
